# Default local overrides. The installer copies this to ~/service/mihomo/override.yaml,
# fills in the chosen ports and a random secret, and `mo` keeps it up to date.
# Values here always win over the subscription. __GH_PROXY__ expands to MO_GH_PROXY.
mixed-port: 7897
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ''
profile:
  store-selected: true
  store-fake-ip: true
geo-auto-update: false
geox-url:
  geoip: __GH_PROXY__https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: __GH_PROXY__https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: __GH_PROXY__https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: __GH_PROXY__https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
