# Base profile used when the subscription is not a Clash/Mihomo YAML
# (node links or Base64). Local settings come from override.yaml.
mode: rule
log-level: info
proxy-providers:
  sub:
    type: file
    path: ./providers/sub.txt
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
proxy-groups:
  - name: Proxy
    type: select
    use:
      - sub
    proxies:
      - Auto
      - DIRECT
  - name: Auto
    type: url-test
    use:
      - sub
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
