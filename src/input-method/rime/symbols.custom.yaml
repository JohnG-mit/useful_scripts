patch:
  # 整块覆盖 half_shape：特殊符号直接上屏，不弹全/半角菜单
  # 逗号句号叹号问号等保留中文全角，成对引号保留中文智能引号
  punctuator/half_shape:
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '?' : { commit: ？ }
    ';' : { commit: ； }
    ':' : { commit: ： }
    '!' : { commit: ！ }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '^' : { commit: …… }
    '(' : （
    ')' : ）
    '_' : ——
    '<' : '<'
    '>' : '>'
    '/' : '/'
    '\' : { commit: 、 }
    '|' : '|'
    '`' : { commit: '`' }
    '~' : '~'
    '@' : '@'
    '#' : '#'
    '%' : '%'
    '$' : '$'
    '&' : '&'
    '*' : '*'
    '-' : '-'
    '+' : '+'
    '=' : '='
    '[' : '['
    ']' : ']'
    '{' : '{'
    '}' : '}'
