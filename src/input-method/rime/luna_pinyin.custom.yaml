patch:
  # 默认简体中文（simplification 是第 3 个开关，索引 @2）
  # 开机默认输出简体，可用 Ctrl+, 或方案菜单切换繁体
  switches/@2/reset: 1

  # ascii_punct 保持关闭（0）→ 中文模式走 half_shape 标点表：
  #   逗号句号等为中文全角（，。？；：！），特殊符号为半角直接上屏
  #   英文（ascii_mode）下所有标点自动回退为半角 ASCII
  # half_shape 表里特殊符号的纯标量化由 symbols.custom.yaml 处理
  switches/@3/reset: 0
