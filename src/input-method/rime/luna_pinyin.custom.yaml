patch:
  # 单独按左右 Shift 可在中文和英文模式间切换；有未上屏编码时先提交编码
  ascii_composer/switch_key/Shift_L: commit_code
  ascii_composer/switch_key/Shift_R: commit_code

  # 默认简体中文（simplification 是第 3 个开关，索引 @2）
  # 开机默认输出简体，可用 Ctrl+, 或方案菜单切换繁体
  switches/@2/reset: 1

  # ascii_punct 保持关闭（0）→ 中文模式走 half_shape 标点表：
  #   逗号句号等为中文全角（，。？；：！），反斜杠键输出顿号，其余特殊符号直接上屏
  #   英文（ascii_mode）下所有标点自动回退为半角 ASCII
  # half_shape 标点表由 symbols.custom.yaml 处理
  switches/@3/reset: 0
  
  # 禁用反引号触发的笔画反查
  recognizer/patterns/reverse_lookup: '^$'
